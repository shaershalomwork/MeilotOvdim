<app-card title="רכיבים נוספים" subtitle="אותה שפה, בכל פעולה">
  <mat-tab-group animationDuration="0ms" [mat-stretch-tabs]="false">
    <mat-tab label="פעולות"
      ><div class="tab-content">
        <p class="example-description">פעולה ראשית בולטת, ושאר האפשרויות לצידה.</p>
        <div class="example-buttons">
          <button mat-flat-button type="button" (click)="openExampleDialog()">אישור פעולה</button
          ><button
            mat-stroked-button
            type="button"
            (click)="showNotice('הפעולה המשנית לדוגמה בוצעה.')"
          >
            פעולה משנית</button
          ><button mat-stroked-button type="button" disabled>לא זמין כרגע</button>
        </div>
        <button mat-button type="button" class="dialog-link" (click)="openExampleDialog()">
          פתיחת חלון אישור<app-icon name="arrow-left" />
        </button></div
    ></mat-tab>
    <mat-tab label="מצבים"
      ><div class="tab-content">
        <p class="example-description">מצבים ברורים לאורך תהליך העבודה.</p>
        <div class="badge-examples">
          <app-status-badge tone="success">הושלם</app-status-badge
          ><app-status-badge tone="warning">ממתין לאישור</app-status-badge
          ><app-status-badge tone="danger">דורש טיפול</app-status-badge
          ><app-status-badge>טיוטה</app-status-badge>
        </div>
      </div></mat-tab
    >
    <mat-tab label="ללא נתונים"
      ><app-empty-state title="הכול מעודכן" description="אין כרגע משימות שממתינות לטיפול."
    /></mat-tab>
  </mat-tab-group>
</app-card>
